name: Deploy FORJA MUSCLE Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build minimal VITAFIT site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/css _site/js _site/icons
          cp index.html refresh.html manifest.webmanifest service-worker.js _site/
          cp css/v4.css _site/css/
          cp js/v4.js _site/js/
          cp icons/vitafit.svg icons/icon-192.png icons/icon-512.png _site/icons/
          test "$(find _site -type f | wc -l)" -eq 9
          du -sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload minimal static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
