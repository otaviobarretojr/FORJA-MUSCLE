name: Validate VITAFIT v3.6.5

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitafit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build synchronization
        run: |
          grep -Fq "const BUILD='3.6.5'" index.html
          grep -Fq "const BUILD='3.6.5'" service-worker.js
          grep -Fq 'content="3.6.5"' index.html
          grep -Fq "css/v365.css?v=3.6.5" index.html
          grep -Fq "'v365.js'" index.html
          grep -Fq "forja-muscle-v3-6-5-vitafit-fast-core" service-worker.js
      - name: Validate nutrition removal
        run: |
          test -f js/v365.js
          test -f css/v365.css
          grep -Fq '.app-nav-btn[data-screen="nutricao"]' css/v365.css
          grep -Fq "REMOVED=new Set(['nutricao','evolucao'])" js/v365.js
          grep -Fq "repeat(3" css/v365.css
      - name: Validate interaction performance audit
        run: |
          ! grep -Fq 'new MutationObserver' js/v363.js
          ! grep -Fq 'new MutationObserver' js/v364.js
          grep -Fq 'touch-action:manipulation' css/v365.css
          grep -Fq 'content-visibility:auto' css/v365.css
          grep -Fq 'window.setAppScreen.__vitafitFast=true' js/v365.js
      - name: Validate local workout video remains
        run: |
          grep -Fq "indexedDB.open" js/v363.js
          grep -Fq "Importar vídeo da galeria" js/v363.js
          ! grep -Fq "./assets/videos/" service-worker.js
      - name: Syntax check
        run: |
          node --check js/v363.js
          node --check js/v364.js
          node --check js/v365.js
          node --check service-worker.js
