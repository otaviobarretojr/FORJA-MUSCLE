name: Validate VITAFIT v3.6.10

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitafit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build synchronization
        run: |
          grep -Fq "const BUILD='3.6.10'" index.html
          grep -Fq "const BUILD='3.6.10'" service-worker.js
          grep -Fq 'content="3.6.10"' index.html
          grep -Fq "css/v369.css?v=3.6.10" index.html
          grep -Fq "'v369.js'" index.html
          grep -Fq "forja-muscle-v3-6-10-vitafit-polish-core" service-worker.js
      - name: Validate fixed weekly standard
        run: |
          grep -Fq "const dayOrder=['seg','qua','sex','dom']" js/v360.js
          grep -Fq "2:{label:'TER',minutes:20}" js/v369.js
          grep -Fq "4:{label:'QUI',minutes:40}" js/v369.js
          grep -Fq "6:{label:'SÁB',minutes:20}" js/v369.js
          grep -Fq "span>${s?'Treino':'Cardio'}" js/v369.js
          grep -Fq "grid-template-columns:repeat(7" css/v369.css
          ! grep -Fq "overflow-x:auto" css/v369.css
      - name: Validate simplified cardio panel and correct date state
        run: |
          grep -Fq "targetDateForDow" js/v369.js
          grep -Fq "cardioKey" js/v369.js
          grep -Fq "grid-template-columns:repeat(2,1fr)" css/v369.css
          ! grep -Fq "<span>sessão</span>" js/v369.js
      - name: Validate More remains essential
        run: |
          grep -Fq "rebuildMore" js/v367.js
          grep -Fq "Somente o essencial" js/v367.js
          ! grep -Fiq "macro" js/v367.js
          ! grep -Fiq "refeição" js/v367.js
      - name: Validate local workout video
        run: |
          grep -Fq "indexedDB.open" js/v363.js
          grep -Fq "Importar vídeo da galeria" js/v363.js
      - name: Syntax check
        run: |
          node --check js/v360.js
          node --check js/v363.js
          node --check js/v366.js
          node --check js/v367.js
          node --check js/v369.js
          node --check service-worker.js
