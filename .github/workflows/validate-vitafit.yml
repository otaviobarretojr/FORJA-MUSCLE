name: Validate VITAFIT V4
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  vitafit-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V4 single-runtime architecture
        run: |
          set -euo pipefail
          grep -Fq 'content="4.0.0"' index.html
          grep -Fq 'css/v4.css?v=4.0.0' index.html
          grep -Fq 'js/v4.js?v=4.0.0' index.html
          test "$(grep -o '<script[^>]*src=' index.html | wc -l)" -eq 1
          test "$(grep -o '<link[^>]*stylesheet' index.html | wc -l)" -eq 1
          ! grep -Fiq 'nutrition.html' index.html
          ! grep -Fiq 'fragments/' index.html
          ! grep -Fq 'v369.js' index.html
      - name: Validate fixed weekly standard
        run: |
          grep -Fq "2:{label:'TER',type:'cardio',minutes:20" js/v4.js
          grep -Fq "4:{label:'QUI',type:'cardio',minutes:40" js/v4.js
          grep -Fq "6:{label:'SÁB',type:'cardio',minutes:20" js/v4.js
          grep -Fq "0:{label:'DOM',type:'strength'" js/v4.js
          grep -Fq "1:{label:'SEG',type:'strength'" js/v4.js
          grep -Fq "3:{label:'QUA',type:'strength'" js/v4.js
          grep -Fq "5:{label:'SEX',type:'strength'" js/v4.js
      - name: Validate persistence and local video
        run: |
          grep -Fq "const NS='shape12.v360.'" js/v4.js
          grep -Fq "const CARDIO_NS='shape12.v369.'" js/v4.js
          grep -Fq "indexedDB.open" js/v4.js
          grep -Fq "URL.revokeObjectURL" js/v4.js
          grep -Fq "dbPromise" js/v4.js
          ! grep -Fq 'MutationObserver' js/v4.js
      - name: Validate minimal PWA shell
        run: |
          grep -Fq "const BUILD='4.0.0'" service-worker.js
          grep -Fq "const CACHE='vitafit-v4-core'" service-worker.js
          grep -Fq "'./css/v4.css'" service-worker.js
          grep -Fq "'./js/v4.js'" service-worker.js
          ! grep -Fiq 'nutrition' service-worker.js
          ! grep -Fiq 'fragments/' service-worker.js
          ! grep -Fq './js/v369.js' service-worker.js
      - name: Validate code size budget
        run: |
          test $(wc -c < js/v4.js) -lt 60000
          test $(wc -c < css/v4.css) -lt 40000
          test $(wc -c < service-worker.js) -lt 5000
      - name: Syntax check
        run: |
          node --check js/v4.js
          node --check service-worker.js
