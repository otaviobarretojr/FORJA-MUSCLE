name: Validate VITAFIT v3.6.6

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitafit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build synchronization
        run: |
          grep -Fq "const BUILD='3.6.6'" index.html
          grep -Fq "const BUILD='3.6.6'" service-worker.js
          grep -Fq 'content="3.6.6"' index.html
          grep -Fq "css/v366.css?v=3.6.6" index.html
          grep -Fq "'v366.js'" index.html
          grep -Fq "forja-muscle-v3-6-6-vitafit-clean-core" service-worker.js
      - name: Validate consolidated cleanup
        run: |
          test -f js/v366.js
          test -f css/v366.css
          ! test -e js/v361.js
          ! test -e js/v362.js
          ! test -e js/v364.js
          ! test -e js/v365.js
          ! test -e css/v361.css
          ! test -e css/v362.css
          ! test -e css/v364.css
          ! test -e css/v365.css
          grep -Fq "REMOVED=new Set(['nutricao','evolucao'])" js/v366.js
          grep -Fq 'repeat(3' css/v366.css
          ! grep -Fq "'v364.js'" index.html
          ! grep -Fq "'v365.js'" index.html
      - name: Validate interaction performance layer
        run: |
          ! grep -Fq 'new MutationObserver' js/v363.js
          ! grep -Fq 'new MutationObserver' js/v366.js
          grep -Fq 'touch-action:manipulation' css/v366.css
          grep -Fq 'content-visibility:auto' css/v366.css
          grep -Fq 'window.setAppScreen.__vitafitFast=true' js/v366.js
      - name: Validate local workout video remains
        run: |
          grep -Fq "indexedDB.open" js/v363.js
          grep -Fq "Importar vídeo da galeria" js/v363.js
          ! grep -Fq "./assets/videos/" service-worker.js
      - name: Syntax check
        run: |
          node --check js/v363.js
          node --check js/v366.js
          node --check service-worker.js
