name: Validate VITAFIT v3.6.4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitafit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build synchronization
        run: |
          grep -Fq "const BUILD='3.6.4'" index.html
          grep -Fq "const BUILD='3.6.4'" service-worker.js
          grep -Fq 'content="3.6.4"' index.html
          grep -Fq "css/v364.css?v=3.6.4" index.html
          grep -Fq "'v364.js'" index.html
          grep -Fq "forja-muscle-v3-6-4-vitafit-simplified" service-worker.js
      - name: Validate simplified app
        run: |
          test -f js/v364.js
          test -f css/v364.css
          grep -Fq '.app-nav-btn[data-screen="evolucao"]' css/v364.css
          grep -Fq "removeProgram" js/v364.js
          grep -Fq "removeEditor" js/v364.js
          grep -Fq "id==='evolucao'?'hoje':id" js/v364.js
          grep -Fq "repeat(4" css/v364.css
      - name: Validate local workout video remains
        run: |
          test -f js/v363.js
          grep -Fq "indexedDB.open" js/v363.js
          grep -Fq "Importar vídeo da galeria" js/v363.js
          ! grep -Fq "./assets/videos/" service-worker.js
      - name: Syntax check
        run: |
          node --check js/v363.js
          node --check js/v364.js
          node --check service-worker.js
