name: Validate VITAFIT v3.6.7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitafit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build synchronization
        run: |
          grep -Fq "const BUILD='3.6.7'" index.html
          grep -Fq "const BUILD='3.6.7'" service-worker.js
          grep -Fq 'content="3.6.7"' index.html
          grep -Fq "css/v367.css?v=3.6.7" index.html
          grep -Fq "'v367.js'" index.html
          grep -Fq "forja-muscle-v3-6-7-vitafit-weekly-core" service-worker.js
      - name: Validate four-day weekly schedule
        run: |
          test -f js/v367.js
          test -f css/v367.css
          grep -Fq "source:'seg',day:'SEG'" js/v367.js
          grep -Fq "source:'ter',day:'QUA'" js/v367.js
          grep -Fq "source:'qua',day:'SEX'" js/v367.js
          grep -Fq "source:'qui',day:'DOM'" js/v367.js
          grep -Fq "CARDIO_DOW=new Set([2,4,6])" js/v367.js
          grep -Fq "4 treinos de musculação" js/v367.js
      - name: Validate More cleanup
        run: |
          grep -Fq "rebuildMore" js/v367.js
          grep -Fq "Somente o essencial" js/v367.js
          grep -Fq "Exportar backup" js/v367.js
          ! grep -Fiq "macro" js/v367.js
          ! grep -Fiq "refeição" js/v367.js
          ! grep -Fiq "compras" js/v367.js
      - name: Validate performance and local workout video
        run: |
          ! grep -Fq 'new MutationObserver' js/v363.js
          ! grep -Fq 'new MutationObserver' js/v366.js
          ! grep -Fq 'new MutationObserver' js/v367.js
          grep -Fq 'touch-action:manipulation' css/v366.css
          grep -Fq "indexedDB.open" js/v363.js
          grep -Fq "Importar vídeo da galeria" js/v363.js
      - name: Syntax check
        run: |
          node --check js/v360.js
          node --check js/v363.js
          node --check js/v366.js
          node --check js/v367.js
          node --check service-worker.js
