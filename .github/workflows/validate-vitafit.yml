name: Validate VITAFIT v3.5.3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitafit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build synchronization
        run: |
          grep -Fq "const BUILD='3.5.3'" index.html
          grep -Fq "const BUILD='3.5.3'" service-worker.js
          grep -Fq "const BUILD='3.5.3'" js/v351.js
          grep -Fq "const BUILD='3.5.3'" js/v353.js
          grep -Fq 'content="3.5.3"' index.html
          grep -Fq "css/v351.css?v=3.5.3" index.html
          grep -Fq "css/v351-accessibility.css?v=3.5.3" index.html
          grep -Fq "css/v353.css?v=3.5.3" index.html
          grep -Fq "'v353.js'" index.html
      - name: Validate redesigned areas
        run: |
          grep -Fq "Treino de hoje" js/v350.js
          grep -Fq "Refeições, macros e hidratação" js/v350.js
          grep -Fq "Fases, evolução dos treinos" js/v350.js
          grep -Fq "Perfil, compras, relatórios" js/v350.js
          grep -Fq "vita-more-brand" css/v350.css
          grep -Fq "program-stage.current" css/v350.css
          grep -Fq "#nutricao #meals" css/v350.css
          grep -Fq "#trainingDayStage .guided-active" css/v350.css
      - name: Validate readable typography layer
        run: |
          test -f css/v351-accessibility.css
          test -f tests/e2e-accessible-text.js
          grep -Fq "css/v351-accessibility.css?v=3.5.3" index.html
          grep -Fq "css/v351-accessibility.css" service-worker.js
          grep -Fq ".vita-primary-action{min-height:58px;font-size:15px}" css/v351-accessibility.css
          grep -Fq ".set-input{min-height:42px;font-size:15px}" css/v351-accessibility.css
          grep -Fq "#nutricao .meal p{font-size:15px" css/v351-accessibility.css
          grep -Fq ".program-ex b{font-size:14px" css/v351-accessibility.css
          grep -Fq ".app-nav-btn .nav-label{font-size:11px" css/v351-accessibility.css
      - name: Validate fast navigation contract
        run: |
          test -f js/v353.js
          test -f css/v353.css
          test -f tests/e2e-navigation-latency.js
          grep -Fq "fastSetAppScreen.__vitafitFast=true" js/v353.js
          grep -Fq "window.setAppScreen=fastSetAppScreen" js/v353.js
          grep -Fq "if(!opts.keepScroll)jumpTop()" js/v353.js
          grep -Fq "touch-action:manipulation" css/v353.css
          grep -Fq ".app-screen{animation:none!important}" css/v353.css
          grep -Fq "Run navigation latency audit" .github/workflows/e2e-vitafit.yml
      - name: Validate offline-first shell
        run: |
          test -f tests/e2e-offline.js
          grep -Fq "forja-muscle-v3-5-3-vitafit-nav-fast" service-worker.js
          grep -Fq "const APP_SHELL=[...CORE,...RUNTIME]" service-worker.js
          grep -Fq "cache.addAll(APP_SHELL)" service-worker.js
          grep -Fq "./css/v353.css" service-worker.js
          grep -Fq "./js/v353.js" service-worker.js
          grep -Fq "context.setOffline(true)" tests/e2e-offline.js
      - name: Validate Home actions and install entry
        run: |
          grep -Fq "toggleWorkoutSession" js/v350.js
          grep -Fq "syncGuidedTraining(true)" js/v350.js
          grep -Fq "guided.completed" js/v350.js
          grep -Fq "session.running" js/v350.js
          grep -Fq "cardioDone" js/v350.js
          grep -Fq "vitaInstallCard" js/v351.js
          grep -Fq "beforeinstallprompt" index.html
          grep -Fq "appinstalled" index.html
          grep -Fq "promptEvent.prompt" js/v351.js
          grep -Fq "Adicionar à Tela de Início" js/v351.js
          grep -Fq "const NS='shape12.'" js/base.js
          ! grep -Fq "localStorage.clear" js/v351.js
          ! grep -Fq "store.del(" js/v351.js
      - name: Validate stable VITAFIT header
        run: |
          grep -Fq "vitaStableHeader" js/v350header.js
          grep -Fq "vita-legacy-hero" js/v350header.js
          grep -Fq "v350header.js" index.html
          grep -Fq "v350header.js" service-worker.js
          grep -Fq "syncVersion" js/v351.js
      - name: Validate PWA brand assets
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          grep -Fq '"short_name": "VITAFIT"' manifest.webmanifest
          grep -Fq '"display": "standalone"' manifest.webmanifest
          grep -Fq "icons/vitafit.svg" manifest.webmanifest
          grep -Fq "icons/vitafit.svg" index.html
          grep -Fq "icons/vitafit.svg" service-worker.js
      - name: Syntax check
        run: |
          node --check js/v350.js
          node --check js/v350fix.js
          node --check js/v350header.js
          node --check js/v351.js
          node --check js/v353.js
          node --check tests/e2e-accessible-text.js
          node --check tests/e2e-navigation-latency.js
          node --check tests/e2e-offline.js
          node --check service-worker.js
