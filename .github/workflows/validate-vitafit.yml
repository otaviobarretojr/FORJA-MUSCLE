name: Validate VITAFIT v3.5.4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitafit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build synchronization
        run: |
          grep -Fq "const BUILD='3.5.4'" index.html
          grep -Fq "const BUILD='3.5.4'" service-worker.js
          grep -Fq 'content="3.5.4"' index.html
          grep -Fq "css/v354.css?v=3.5.4" index.html
          grep -Fq "'v354.js'" index.html
          grep -Fq "forja-muscle-v3-5-4-vitafit-workout-video" service-worker.js
      - name: Validate official workout routine
        run: |
          test -f js/v354.js
          test -f css/v354.css
          grep -Fq "Agachamento sumô" js/v354.js
          grep -Fq "Remada máquina" js/v354.js
          grep -Fq "Cadeira extensora" js/v354.js
          grep -Fq "Agachamento búlgaro" js/v354.js
          grep -Fq "HIIT na esteira" js/v354.js
          grep -Fq "exercise-demo-btn" js/v354.js
          grep -Fq "forja-video-modal" css/v354.css
      - name: Validate workout videos
        run: |
          for f in segunda superiores quarta sexta; do
            test -s "assets/workouts/${f}.b64"
            python3 - "$f" <<'PY'
          import base64, pathlib, sys
          p=pathlib.Path('assets/workouts')/(sys.argv[1]+'.b64')
          raw=base64.b64decode(p.read_text().strip(), validate=True)
          assert raw[4:8] == b'ftyp', (p, raw[:12])
          assert len(raw) > 5000, (p, len(raw))
          PY
          done
          grep -Fq "./assets/workouts/segunda.b64" service-worker.js
          grep -Fq "./assets/workouts/superiores.b64" service-worker.js
          grep -Fq "./assets/workouts/quarta.b64" service-worker.js
          grep -Fq "./assets/workouts/sexta.b64" service-worker.js
      - name: Validate preserved platform contracts
        run: |
          grep -Fq "fastSetAppScreen.__vitafitFast=true" js/v353.js
          grep -Fq "window.setAppScreen=fastSetAppScreen" js/v353.js
          grep -Fq "touch-action:manipulation" css/v353.css
          grep -Fq "const NS='shape12.'" js/base.js
          grep -Fq "const APP_SHELL=[...CORE,...RUNTIME]" service-worker.js
          grep -Fq "cache.addAll(APP_SHELL)" service-worker.js
          grep -Fq "beforeinstallprompt" index.html
          grep -Fq "appinstalled" index.html
      - name: Syntax check
        run: |
          node --check js/v354.js
          node --check js/v353.js
          node --check js/v351.js
          node --check service-worker.js
