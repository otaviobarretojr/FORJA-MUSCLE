name: Production Smoke VITAFIT
on:
  workflow_run:
    workflows: ["Deploy FORJA MUSCLE Pages"]
    types: [completed]
jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public VITAFIT V4 deployment
        env:
          BASE_URL: https://otaviobarretojr.github.io/FORJA-MUSCLE
        run: |
          set -euo pipefail
          audit="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fetch_until_match() {
            local url="$1" pattern="$2" out="$3"
            for attempt in $(seq 1 24); do
              if curl -fLsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${url}?audit=${audit}-${attempt}" -o "$out"; then
                if grep -Fq -- "$pattern" "$out"; then return 0; fi
              fi
              sleep 5
            done
            echo "Expected pattern not found: $pattern"; cat "$out" || true; return 1
          }
          fetch_until_match "${BASE_URL}/" 'content="4.0.0"' /tmp/index.html
          grep -Fq -- 'css/v4.css?v=4.0.0' /tmp/index.html
          grep -Fq -- 'js/v4.js?v=4.0.0' /tmp/index.html
          test "$(grep -o '<script[^>]*src=' /tmp/index.html | wc -l)" -eq 1
          ! grep -Fiq -- 'fragments/' /tmp/index.html
          fetch_until_match "${BASE_URL}/service-worker.js" "const BUILD='4.0.0'" /tmp/sw.js
          grep -Fq -- "const CACHE='vitafit-v4-core'" /tmp/sw.js
          ! grep -Fiq -- 'nutrition' /tmp/sw.js
          fetch_until_match "${BASE_URL}/js/v4.js" "const BUILD='4.0.0'" /tmp/v4.js
          grep -Fq -- "minutes:40" /tmp/v4.js
          grep -Fq -- "indexedDB.open" /tmp/v4.js
          fetch_until_match "${BASE_URL}/css/v4.css" ".bottom-nav" /tmp/v4.css
          if curl -fLsS "${BASE_URL}/js/v369.js?audit=${audit}" >/dev/null 2>&1; then echo 'Legacy JS still public'; exit 1; fi
          if curl -fLsS "${BASE_URL}/fragments/nutrition.html?audit=${audit}" >/dev/null 2>&1; then echo 'Retired nutrition fragment still public'; exit 1; fi
          echo "Production VITAFIT V4 smoke: OK"
