name: Production Smoke VITAFIT

on:
  workflow_run:
    workflows: ["Deploy FORJA MUSCLE Pages"]
    types: [completed]

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public VITAFIT deployment
        env:
          BASE_URL: https://otaviobarretojr.github.io/FORJA-MUSCLE
        run: |
          set -euo pipefail
          audit="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch_until_match() {
            local url="$1"
            local pattern="$2"
            local out="$3"
            for attempt in $(seq 1 18); do
              echo "Audit attempt ${attempt}: ${url}"
              if curl -fLsS --connect-timeout 10 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                "${url}?audit=${audit}-${attempt}" -o "$out"; then
                if grep -Fq -- "$pattern" "$out"; then
                  return 0
                fi
              fi
              sleep 5
            done
            echo "Expected pattern not found: $pattern"
            cat "$out" || true
            return 1
          }

          fetch_until_match "${BASE_URL}/" "VITAFIT • Força, saúde & evolução" /tmp/index.html
          grep -Fq -- 'content="3.5.3"' /tmp/index.html
          grep -Fq -- 'css/v351-accessibility.css?v=3.5.3' /tmp/index.html
          grep -Fq -- 'css/v353.css?v=3.5.3' /tmp/index.html
          grep -Fq -- "'v351.js'" /tmp/index.html
          grep -Fq -- "'v353.js'" /tmp/index.html
          grep -Fq -- "beforeinstallprompt" /tmp/index.html
          grep -Fq -- "appinstalled" /tmp/index.html

          fetch_until_match "${BASE_URL}/manifest.webmanifest" '"name": "VITAFIT"' /tmp/manifest.webmanifest
          grep -Fq -- '"short_name": "VITAFIT"' /tmp/manifest.webmanifest
          grep -Fq -- '"display": "standalone"' /tmp/manifest.webmanifest

          fetch_until_match "${BASE_URL}/service-worker.js" "const BUILD='3.5.3'" /tmp/service-worker.js
          grep -Fq -- "forja-muscle-v3-5-3-vitafit-nav-fast" /tmp/service-worker.js
          grep -Fq -- "const APP_SHELL=[...CORE,...RUNTIME]" /tmp/service-worker.js
          grep -Fq -- "cache.addAll(APP_SHELL)" /tmp/service-worker.js
          grep -Fq -- "./css/v353.css" /tmp/service-worker.js
          grep -Fq -- "./js/v353.js" /tmp/service-worker.js
          grep -Fq -- "navigationPreload.enable" /tmp/service-worker.js
          grep -Fq -- "self.clients.claim()" /tmp/service-worker.js
          ! grep -Fq -- "client.navigate(" /tmp/service-worker.js

          fetch_until_match "${BASE_URL}/css/v351-accessibility.css" ".vita-primary-action{min-height:58px;font-size:15px}" /tmp/v351-accessibility.css
          fetch_until_match "${BASE_URL}/css/v353.css" "touch-action:manipulation" /tmp/v353.css
          grep -Fq -- ".app-screen{animation:none!important}" /tmp/v353.css
          fetch_until_match "${BASE_URL}/js/v351.js" "const BUILD='3.5.3'" /tmp/v351.js
          fetch_until_match "${BASE_URL}/js/v353.js" "const BUILD='3.5.3'" /tmp/v353.js
          grep -Fq -- "fastSetAppScreen.__vitafitFast=true" /tmp/v353.js
          grep -Fq -- "window.setAppScreen=fastSetAppScreen" /tmp/v353.js
          grep -Fq -- "if(!opts.keepScroll)jumpTop()" /tmp/v353.js

          fetch_until_match "${BASE_URL}/icons/vitafit.svg" "linearGradient id=\"rose\"" /tmp/vitafit.svg
          curl -fLsS --connect-timeout 10 --max-time 20 "${BASE_URL}/assets/projecao-12-semanas.jpg?audit=${audit}" -o /tmp/projecao.jpg
          test -s /tmp/projecao.jpg

          echo "Production VITAFIT v3.5.3 navigation smoke: OK"
