name: Production Smoke VITAFIT

on:
  workflow_run:
    workflows: ["Deploy FORJA MUSCLE Pages"]
    types: [completed]

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public VITAFIT deployment
        env:
          BASE_URL: https://otaviobarretojr.github.io/FORJA-MUSCLE
        run: |
          set -euo pipefail
          audit="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fetch_until_match() {
            local url="$1" pattern="$2" out="$3"
            for attempt in $(seq 1 24); do
              if curl -fLsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${url}?audit=${audit}-${attempt}" -o "$out"; then
                if grep -Fq -- "$pattern" "$out"; then return 0; fi
              fi
              sleep 5
            done
            return 1
          }
          fetch_until_match "${BASE_URL}/" 'content="3.6.4"' /tmp/index.html
          grep -Fq -- 'css/v364.css?v=3.6.4' /tmp/index.html
          grep -Fq -- "'v364.js'" /tmp/index.html
          fetch_until_match "${BASE_URL}/service-worker.js" "const BUILD='3.6.4'" /tmp/service-worker.js
          grep -Fq -- "forja-muscle-v3-6-4-vitafit-simplified" /tmp/service-worker.js
          grep -Fq -- "./js/v364.js" /tmp/service-worker.js
          fetch_until_match "${BASE_URL}/js/v364.js" "removeProgram" /tmp/v364.js
          grep -Fq -- "removeEditor" /tmp/v364.js
          fetch_until_match "${BASE_URL}/css/v364.css" 'repeat(4' /tmp/v364.css
          echo "Production VITAFIT v3.6.4 simplified smoke: OK"
