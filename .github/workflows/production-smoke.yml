name: Production Smoke VITAFIT

on:
  workflow_run:
    workflows: ["Deploy FORJA MUSCLE Pages"]
    types: [completed]

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public VITAFIT deployment
        env:
          BASE_URL: https://otaviobarretojr.github.io/FORJA-MUSCLE
        run: |
          set -euo pipefail
          audit="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch_until_match() {
            local url="$1"
            local pattern="$2"
            local out="$3"
            for attempt in $(seq 1 24); do
              echo "Audit attempt ${attempt}: ${url}"
              if curl -fLsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${url}?audit=${audit}-${attempt}" -o "$out"; then
                if grep -Fq -- "$pattern" "$out"; then return 0; fi
              fi
              sleep 5
            done
            echo "Expected pattern not found: $pattern"; cat "$out" || true; return 1
          }

          fetch_until_match "${BASE_URL}/" "VITAFIT • Força, saúde & evolução" /tmp/index.html
          grep -Fq -- 'content="3.5.4"' /tmp/index.html
          grep -Fq -- 'css/v354.css?v=3.5.4' /tmp/index.html
          grep -Fq -- "'v354.js'" /tmp/index.html

          fetch_until_match "${BASE_URL}/service-worker.js" "const BUILD='3.5.4'" /tmp/service-worker.js
          grep -Fq -- "forja-muscle-v3-5-4-vitafit-workout-video" /tmp/service-worker.js
          grep -Fq -- "./js/v354.js" /tmp/service-worker.js
          grep -Fq -- "./assets/workouts/segunda.b64" /tmp/service-worker.js
          grep -Fq -- "navigationPreload.enable" /tmp/service-worker.js
          grep -Fq -- "self.clients.claim()" /tmp/service-worker.js

          fetch_until_match "${BASE_URL}/js/v354.js" "Agachamento sumô" /tmp/v354.js
          grep -Fq -- "Agachamento búlgaro" /tmp/v354.js
          grep -Fq -- "Cadeira extensora" /tmp/v354.js
          grep -Fq -- "Remada máquina" /tmp/v354.js
          grep -Fq -- "exercise-demo-btn" /tmp/v354.js
          fetch_until_match "${BASE_URL}/css/v354.css" "forja-video-modal" /tmp/v354.css

          for f in segunda superiores quarta sexta; do
            curl -fLsS --connect-timeout 10 --max-time 20 "${BASE_URL}/assets/workouts/${f}.b64?audit=${audit}" -o "/tmp/${f}.b64"
            test -s "/tmp/${f}.b64"
            base64 -d "/tmp/${f}.b64" > "/tmp/${f}.mp4"
            test "$(dd if="/tmp/${f}.mp4" bs=1 skip=4 count=4 2>/dev/null)" = "ftyp"
          done

          echo "Production VITAFIT v3.5.4 workout smoke: OK"
