name: Production Smoke VITAFIT

on:
  workflow_run:
    workflows: ["Deploy FORJA MUSCLE Pages"]
    types: [completed]

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public VITAFIT deployment
        env:
          BASE_URL: https://otaviobarretojr.github.io/FORJA-MUSCLE
        run: |
          set -euo pipefail
          audit="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fetch_until_match() {
            local url="$1" pattern="$2" out="$3"
            for attempt in $(seq 1 24); do
              if curl -fLsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${url}?audit=${audit}-${attempt}" -o "$out"; then
                if grep -Fq -- "$pattern" "$out"; then return 0; fi
              fi
              sleep 5
            done
            echo "Expected pattern not found: $pattern"; cat "$out" || true; return 1
          }

          fetch_until_match "${BASE_URL}/" 'content="3.6.9"' /tmp/index.html
          grep -Fq -- 'css/v369.css?v=3.6.9' /tmp/index.html
          grep -Fq -- "'v369.js'" /tmp/index.html

          fetch_until_match "${BASE_URL}/service-worker.js" "const BUILD='3.6.9'" /tmp/service-worker.js
          grep -Fq -- "forja-muscle-v3-6-9-vitafit-cardio-core" /tmp/service-worker.js
          grep -Fq -- "./js/v369.js" /tmp/service-worker.js

          fetch_until_match "${BASE_URL}/js/v369.js" "semana completa com cardio" /tmp/v369.js
          grep -Fq -- "2:{label:'TER',minutes:20}" /tmp/v369.js
          grep -Fq -- "4:{label:'QUI',minutes:40}" /tmp/v369.js
          grep -Fq -- "6:{label:'SÁB',minutes:20}" /tmp/v369.js
          grep -Fq -- "function syncDashboard" /tmp/v369.js
          echo "Production VITAFIT v3.6.9 smoke: OK"
