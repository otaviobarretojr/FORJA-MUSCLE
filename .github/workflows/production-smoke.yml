name: Production Smoke VITAFIT

on:
  workflow_run:
    workflows: ["Deploy FORJA MUSCLE Pages"]
    types: [completed]

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public VITAFIT deployment
        env:
          BASE_URL: https://otaviobarretojr.github.io/FORJA-MUSCLE
        run: |
          set -euo pipefail
          audit="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch_until_match() {
            local url="$1"
            local pattern="$2"
            local out="$3"
            for attempt in $(seq 1 18); do
              echo "Audit attempt ${attempt}: ${url}"
              if curl -fLsS --connect-timeout 10 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                "${url}?audit=${audit}-${attempt}" -o "$out"; then
                if grep -Fq -- "$pattern" "$out"; then
                  return 0
                fi
              fi
              sleep 5
            done
            echo "Expected pattern not found: $pattern"
            echo "--- response ---"
            cat "$out" || true
            return 1
          }

          fetch_until_match "${BASE_URL}/" "VITAFIT • Força, saúde & evolução" /tmp/index.html
          grep -Fq -- 'content="3.5.2"' /tmp/index.html
          grep -Fq -- 'css/v351.css?v=3.5.2' /tmp/index.html
          grep -Fq -- 'css/v351-accessibility.css?v=3.5.2' /tmp/index.html
          grep -Fq -- "'v351.js'" /tmp/index.html
          grep -Fq -- "beforeinstallprompt" /tmp/index.html
          grep -Fq -- "appinstalled" /tmp/index.html

          fetch_until_match "${BASE_URL}/manifest.webmanifest" '"name": "VITAFIT"' /tmp/manifest.webmanifest
          grep -Fq -- '"short_name": "VITAFIT"' /tmp/manifest.webmanifest
          grep -Fq -- '"display": "standalone"' /tmp/manifest.webmanifest
          grep -Fq -- 'icons/vitafit.svg' /tmp/manifest.webmanifest

          fetch_until_match "${BASE_URL}/service-worker.js" "const BUILD='3.5.2'" /tmp/service-worker.js
          grep -Fq -- "forja-muscle-v3-5-2-vitafit-offline" /tmp/service-worker.js
          grep -Fq -- "const APP_SHELL=[...CORE,...RUNTIME]" /tmp/service-worker.js
          grep -Fq -- "cache.addAll(APP_SHELL)" /tmp/service-worker.js
          grep -Fq -- "./assets/projecao-12-semanas.jpg" /tmp/service-worker.js
          grep -Fq -- "./fragments/home-dashboard.html" /tmp/service-worker.js
          grep -Fq -- "css/v351.css" /tmp/service-worker.js
          grep -Fq -- "css/v351-accessibility.css" /tmp/service-worker.js
          grep -Fq -- "js/v351.js" /tmp/service-worker.js
          grep -Fq -- "navigationPreload.enable" /tmp/service-worker.js
          ! grep -Fq -- "clients.claim" /tmp/service-worker.js
          ! grep -Fq -- "client.navigate(" /tmp/service-worker.js

          fetch_until_match "${BASE_URL}/css/v351.css" "vita-install-card" /tmp/v351.css
          fetch_until_match "${BASE_URL}/css/v351-accessibility.css" ".vita-primary-action{min-height:58px;font-size:15px}" /tmp/v351-accessibility.css
          grep -Fq -- ".set-input{min-height:42px;font-size:15px}" /tmp/v351-accessibility.css
          grep -Fq -- "#nutricao .meal p{font-size:15px" /tmp/v351-accessibility.css
          grep -Fq -- ".program-ex b{font-size:14px" /tmp/v351-accessibility.css
          fetch_until_match "${BASE_URL}/js/v351.js" "const BUILD='3.5.2'" /tmp/v351.js
          grep -Fq -- "vitaInstallCard" /tmp/v351.js
          grep -Fq -- "ui.installPromptDismissed" /tmp/v351.js
          grep -Fq -- "Adicionar à Tela de Início" /tmp/v351.js
          fetch_until_match "${BASE_URL}/icons/vitafit.svg" "linearGradient id=\"rose\"" /tmp/vitafit.svg
          fetch_until_match "${BASE_URL}/assets/projecao-12-semanas.jpg" "" /tmp/projecao.jpg

          echo "Production VITAFIT offline-first smoke: OK"