name: E2E VITAFIT Chromium

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local VITAFIT
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/vitafit-http.log 2>&1 &
          echo $! >/tmp/vitafit-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/vitafit-http.log
          exit 1
      - name: Run v3.6.6 cleanup browser audit
        run: timeout 150s node tests/e2e-v360.js
      - name: Run navigation latency audit
        run: timeout 90s node tests/e2e-navigation-latency.js
      - name: Run offline PWA audit
        run: timeout 120s node tests/e2e-offline.js
      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/vitafit-http.pid ]; then kill $(cat /tmp/vitafit-http.pid) || true; fi
          cat /tmp/vitafit-http.log || true
