name: E2E VITAFIT Chromium

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local VITAFIT
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/vitafit-http.log 2>&1 &
          echo $! >/tmp/vitafit-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/vitafit-http.log
          exit 1

      - name: Run browser functional audit
        run: timeout 150s node tests/e2e-vitafit-state.js

      - name: Run mobile readability audit
        run: timeout 90s node tests/e2e-accessible-text.js

      - name: Run navigation latency audit
        run: timeout 90s node tests/e2e-navigation-latency.js

      - name: Run first-load offline audit
        run: timeout 90s node tests/e2e-offline.js

      - name: Verify public VITAFIT v3.5.3 navigation
        run: |
          set -euo pipefail
          BASE='https://otaviobarretojr.github.io/FORJA-MUSCLE'
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ok=0
          for attempt in $(seq 1 18); do
            echo "Production probe ${attempt}/18"
            if curl -fLsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/?audit=${stamp}-${attempt}" -o /tmp/prod-index.html \
              && grep -Fq 'content="3.5.3"' /tmp/prod-index.html \
              && grep -Fq 'css/v353.css?v=3.5.3' /tmp/prod-index.html \
              && grep -Fq "'v353.js'" /tmp/prod-index.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          curl -fLsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/service-worker.js?audit=${stamp}" -o /tmp/prod-sw.js
          grep -Fq "const BUILD='3.5.3'" /tmp/prod-sw.js
          grep -Fq 'forja-muscle-v3-5-3-vitafit-nav-fast' /tmp/prod-sw.js
          curl -fLsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/js/v353.js?audit=${stamp}" -o /tmp/prod-v353.js
          grep -Fq 'fastSetAppScreen.__vitafitFast=true' /tmp/prod-v353.js
          grep -Fq 'window.setAppScreen=fastSetAppScreen' /tmp/prod-v353.js
          echo 'PUBLIC VITAFIT v3.5.3 NAVIGATION: OK'

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/vitafit-http.pid ]; then kill $(cat /tmp/vitafit-http.pid) || true; fi
          cat /tmp/vitafit-http.log || true
