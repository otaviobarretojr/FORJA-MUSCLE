name: Validate FORJA MUSCLE v3.4.5

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-v345:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fast update bootstrap
        run: |
          grep -Fq "const BUILD='3.4.5'" index.html
          grep -Fq "meta name=\"forja-build\" content=\"3.4.5\"" index.html
          grep -Fq "serviceWorker.addEventListener('message'" index.html
          grep -Fq "serviceWorker.register('service-worker.js?v='+BUILD" index.html
          grep -Fq "FORJA_READY" index.html
          ! grep -Fq "window.addEventListener('load',()=>navigator.serviceWorker.register" index.html
          grep -Fq "const BUILD='3.4.5'" service-worker.js
          grep -Fq "forja-muscle-v3-4-5" service-worker.js
          grep -Fq "const CORE=" service-worker.js
          grep -Fq "cache.addAll(CORE)" service-worker.js
          grep -Fq "client.postMessage({type:'FORJA_READY',build:BUILD})" service-worker.js
          ! grep -Fq "client.navigate(" service-worker.js
          grep -Fq "navigationPreload.enable" service-worker.js
          grep -Fq "const NS='shape12.'" js/base.js
      - name: Validate JavaScript syntax
        run: node --check service-worker.js
