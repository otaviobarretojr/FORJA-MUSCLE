name: Validate FORJA MUSCLE

on:
  push:
    branches: [main, release-v3]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f refresh.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f assets/projecao-12-semanas.jpg
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f fragments/home-dashboard.html
          test -f fragments/nutrition.html
          test -f fragments/training.html
          test -f fragments/modals.html
          test -f css/v31.css
          test -f js/v31.js
          test -f css/v32.css
          test -f js/v32.js
          test -f css/v33.css
          test -f js/v33.js
          test -f js/v332.js
          test -f css/v333.css
          test -f js/v333.js
          test -f css/v334.css
          test -f js/v334.js
          test -f css/v340.css
          test -f js/v340.js
          test -f css/v341.css
          test -f js/v341.js
          test -f css/v342.css
          test -f js/v342.js

      - name: Validate JavaScript syntax
        run: |
          for file in js/*.js service-worker.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Check shell references
        run: |
          grep -q "fragments/home-dashboard.html" service-worker.js
          grep -q "refresh.html" service-worker.js
          grep -q "js/v30b2.js" service-worker.js
          grep -q "js/v31.js" service-worker.js
          grep -q "js/v32.js" service-worker.js
          grep -q "css/v32.css" service-worker.js
          grep -q "js/v33.js" service-worker.js
          grep -q "css/v33.css" service-worker.js
          grep -q "js/v332.js" service-worker.js
          grep -q "js/v333.js" service-worker.js
          grep -q "css/v333.css" service-worker.js
          grep -q "js/v334.js" service-worker.js
          grep -q "css/v334.css" service-worker.js
          grep -q "js/v340.js" service-worker.js
          grep -q "css/v340.css" service-worker.js
          grep -q "js/v341.js" service-worker.js
          grep -q "css/v341.css" service-worker.js
          grep -q "js/v342.js" service-worker.js
          grep -q "css/v342.css" service-worker.js
          grep -q "manifest.webmanifest" index.html
          grep -q "v32.js" index.html
          grep -q "v32.css" index.html
          grep -q "v33.js" index.html
          grep -q "v33.css" index.html
          grep -q "v332.js" index.html
          grep -q "v333.js" index.html
          grep -q "v333.css" index.html
          grep -q "v334.js" index.html
          grep -q "v334.css" index.html
          grep -q "v340.js" index.html
          grep -q "v340.css" index.html
          grep -q "v341.js" index.html
          grep -q "v341.css" index.html
          grep -q "v342.js" index.html
          grep -q "v342.css" index.html

      - name: Validate v3.1 navigation bootstrap
        run: |
          grep -Fq "root.innerHTML=fragments.join('')" index.html
          ! grep -Fq "root.insertAdjacentHTML" index.html
          grep -Fq "const main=document.querySelector('main')" js/v31.js
          grep -Fq "createBottomNav(document.body)" js/v31.js
          grep -Fq "networkFirst" service-worker.js

      - name: Validate v3.2 training blocks and compatibility
        run: |
          grep -Fq "selectTrainingDay" js/v32.js
          grep -Fq "trainingDayStage" js/v32.js
          grep -Fq "Planejamento e ferramentas" js/v32.js
          grep -Fq "const NS='shape12.'" js/base.js

      - name: Validate v3.3 guided workout
        run: |
          grep -Fq "guided.exerciseIndex" js/v33.js
          grep -Fq "Concluir exercício" js/v33.js
          grep -Fq "TREINO DE HOJE" js/v33.js
          grep -Fq "visual técnico vetorial" js/v33.js
          grep -Fq "#treino #schedule{display:none!important}" css/v33.css
          grep -Fq "shape12.*" js/v33.js

      - name: Validate v3.3.1 startup compatibility
        run: |
          grep -Fq "Carregando seu treino" index.html
          ! grep -Fq "fetch('fragments/'+p+'?v='+BUILD,{cache:'no-store'})" index.html
          grep -Fq "const NS='shape12.'" js/base.js

      - name: Validate v3.3.2 clean training focus
        run: |
          grep -Fq "hero.hidden=true" js/v332.js
          grep -Fq "active.querySelector('.guided-visual')?.remove()" js/v332.js
          grep -Fq "guided-clean-focus" js/v332.js
          grep -Fq "shape12.*" js/v332.js

      - name: Validate v3.3.3 compact rest timer
        run: |
          grep -Fq "rest-mini-active" js/v333.js
          grep -Fq "Dispensar descanso" js/v333.js
          grep -Fq "previousStartRest" js/v333.js
          grep -Fq "rest-mini-card" css/v333.css
          grep -Fq "conic-gradient" css/v333.css
          grep -Fq "shape12.*" js/v333.js

      - name: Validate v3.3.4 exercise coaching
        run: |
          grep -Fq "Dicas do movimento" js/v334.js
          grep -Fq "Evite isso" js/v334.js
          grep -Fq "Semana de treino" js/v334.js
          grep -Fq "exerciseCoachCard" js/v334.js
          grep -Fq "forja-v334-hidden" css/v334.css
          grep -Fq "exercise-coach-grid" css/v334.css
          grep -Fq "shape12.*" js/v334.js

      - name: Validate v3.4 progressive training cycles
        run: |
          grep -Fq "training.cycleStart" js/v340.js
          grep -Fq "Aguardando o primeiro treino concluído" js/v340.js
          grep -Fq "Adaptação" js/v340.js
          grep -Fq "Iniciante" js/v340.js
          grep -Fq "Intermediário" js/v340.js
          grep -Fq "2×12–15" js/v340.js
          grep -Fq "strengthDays:[1,3,5]" js/v340.js
          grep -Fq "strengthDays:[1,3,5,0]" js/v340.js
          grep -Fq "training-stage-prescription" css/v340.css
          grep -Fq "shape12.*" js/v340.js
          grep -Fq "const NS='shape12.'" js/base.js

      - name: Validate v3.4.1 Home, Program and active recovery
        run: |
          grep -Fq "homeCycleCard" js/v341.js
          grep -Fq "Programação" js/v341.js
          grep -Fq "legacyEvolutionArchive" js/v341.js
          grep -Fq "Bicicleta ergométrica" js/v341.js
          grep -Fq "Caminhada na esteira" js/v341.js
          grep -Fq "window.isCardioPlanned=function(dow){return !isStrengthDow(dow)}" js/v341.js
          grep -Fq "RECUPERAÇÃO ATIVA" js/v341.js
          grep -Fq "program-stage" css/v341.css
          grep -Fq "home-cycle-card" css/v341.css
          grep -Fq "const NS='shape12.'" js/base.js

      - name: Validate v3.4.2 clean Home
        run: |
          grep -Fq "homeLegacyArchive" js/v342.js
          grep -Fq "weeklySummary" js/v342.js
          grep -Fq "today-wrap" js/v342.js
          grep -Fq "O essencial de hoje e o ciclo atual." js/v342.js
          grep -Fq "#homeLegacyArchive[hidden]" css/v342.css
          grep -Fq "shape12.*" js/v342.js
          grep -Fq "const NS='shape12.'" js/base.js

      - name: Validate v3.4.3 fast link opening
        run: |
          grep -Fq "el.async=false" index.html
          grep -Fq "Promise.all(loads)" index.html
          ! grep -Fq "preload.rel='preload'" index.html
          grep -Fq "navigationPreload.enable" service-worker.js
          grep -Fq "return networkFirst(req)" service-worker.js
          grep -Fq "const NS='shape12.'" js/base.js

      - name: Validate v3.4.4 version refresh
        run: |
          grep -Fq "const BUILD='3.4.4'" index.html
          grep -Fq "forja-muscle-v3-4-4" service-worker.js
          grep -Fq "serviceWorker.register" index.html
          grep -Fq "updateViaCache:'none'" index.html
          grep -Fq "forja-updated" service-worker.js
          grep -Fq "oldForjaCaches.length" service-worker.js
          grep -Fq "v${build}" js/v31.js
          grep -Fq "getRegistrations" refresh.html
          grep -Fq "startsWith('forja-muscle-')" refresh.html
          ! grep -Fq "localStorage.clear" refresh.html
          grep -Fq "const NS='shape12.'" js/base.js
