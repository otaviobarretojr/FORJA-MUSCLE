name: Validate VITAFIT

on:
  push:
    branches: [main, release-v3]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f refresh.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/vitafit.svg
          test -f fragments/home-dashboard.html
          test -f fragments/nutrition.html
          test -f fragments/training.html
          test -f fragments/modals.html
          test -f css/v31.css
          test -f css/v33.css
          test -f css/v333.css
          test -f css/v334.css
          test -f css/v340.css
          test -f css/v341.css
          test -f css/v342.css
          test -f css/v350.css
          test -f css/v350fix.css
          test -f css/v351.css
          test -f js/v31.js
          test -f js/v33.js
          test -f js/v332.js
          test -f js/v333.js
          test -f js/v334.js
          test -f js/v340.js
          test -f js/v341.js
          test -f js/v342.js
          test -f js/v350.js
          test -f js/v350fix.js
          test -f js/v350header.js
          test -f js/v351.js

      - name: Validate JavaScript syntax
        run: |
          for file in js/*.js service-worker.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate manifest and SVG
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('icons/vitafit.svg')
          print('SVG OK')
          PY

      - name: Validate persistence contract
        run: |
          grep -Fq "const NS='shape12.'" js/base.js
          grep -Fq "shape12.*" js/v350.js
          grep -Fq "shape12.*" js/v350header.js
          grep -Fq "shape12.*" js/v351.js
          ! grep -Fq "localStorage.clear" js/v350.js
          ! grep -Fq "localStorage.clear" js/v350fix.js
          ! grep -Fq "localStorage.clear" js/v350header.js
          ! grep -Fq "localStorage.clear" js/v351.js
          ! grep -Fq "localStorage.clear" refresh.html

      - name: Validate guided training regressions
        run: |
          grep -Fq "guided.exerciseIndex" js/v33.js
          grep -Fq "Concluir exercício" js/v33.js
          grep -Fq "active.querySelector('.guided-visual')?.remove()" js/v332.js
          grep -Fq "rest-mini-active" js/v333.js
          grep -Fq "Dicas do movimento" js/v334.js
          grep -Fq "training.cycleStart" js/v340.js
          grep -Fq "strengthDays:[1,3,5]" js/v340.js
          grep -Fq "strengthDays:[1,3,5,0]" js/v340.js
          grep -Fq "window.isCardioPlanned=function(dow){return !isStrengthDow(dow)}" js/v341.js
          grep -Fq "Programação" js/v341.js

      - name: Validate VITAFIT identity and Home
        run: |
          grep -Fq "const BUILD='3.5.1'" index.html
          grep -Fq 'content="VITAFIT"' index.html
          grep -Fq "VITAFIT • Força, saúde & evolução" index.html
          grep -Fq "css/v350.css?v=3.5.1" index.html
          grep -Fq "css/v351.css?v=3.5.1" index.html
          grep -Fq "'v350.js'" index.html
          grep -Fq "'v350fix.js'" index.html
          grep -Fq "'v350header.js'" index.html
          grep -Fq "'v351.js'" index.html
          grep -Fq "HOJE NA VITAFIT" js/v350.js
          grep -Fq "vitaHomeDashboard" js/v350.js
          grep -Fq "CONTINUAR TREINO" js/v350.js
          grep -Fq "TREINO CONCLUÍDO" js/v350.js
          grep -Fq "vitaStableHeader" js/v350header.js
          grep -Fq "vita-legacy-hero" js/v350header.js
          grep -Fq "vita-today-card" css/v350.css
          grep -Fq -- "--accent:#e19aaa" css/v350.css
          grep -Fq '"name": "VITAFIT"' manifest.webmanifest
          grep -Fq "icons/vitafit.svg" manifest.webmanifest

      - name: Validate first access install card
        run: |
          grep -Fq "beforeinstallprompt" index.html
          grep -Fq "event.preventDefault()" index.html
          grep -Fq "appinstalled" index.html
          grep -Fq "vitafit-install-ready" index.html
          grep -Fq "vitaInstallCard" js/v351.js
          grep -Fq "ui.installPromptDismissed" js/v351.js
          grep -Fq "ui.appInstalled" js/v351.js
          grep -Fq "Adicionar à Tela de Início" js/v351.js
          grep -Fq "display-mode: standalone" js/v351.js
          grep -Fq "vita-install-card" css/v351.css
          grep -Fq "PRIMEIRO ACESSO" js/v351.js

      - name: Validate PWA update strategy
        run: |
          grep -Fq "const BUILD='3.5.1'" service-worker.js
          grep -Fq "forja-muscle-v3-5-1-vitafit" service-worker.js
          grep -Fq "cache.addAll(CORE)" service-worker.js
          grep -Fq "navigationPreload.enable" service-worker.js
          grep -Fq "css/v350.css" service-worker.js
          grep -Fq "css/v351.css" service-worker.js
          grep -Fq "js/v350.js" service-worker.js
          grep -Fq "js/v350header.js" service-worker.js
          grep -Fq "js/v351.js" service-worker.js
          grep -Fq "icons/vitafit.svg" service-worker.js
          ! grep -Fq "client.navigate(" service-worker.js
          ! grep -Fq "clients.claim" service-worker.js

      - name: Validate bootstrap references
        run: |
          grep -Fq "root.innerHTML=fragments.join('')" index.html
          grep -Fq "Promise.all(loads)" index.html
          grep -Fq "serviceWorker.register('service-worker.js?v='+BUILD" index.html
          grep -Fq "updateViaCache:'none'" index.html
          grep -Fq "document.documentElement.dataset.vitafitReady='true'" index.html
          grep -Fq "getRegistrations" refresh.html
          grep -Fq "startsWith('forja-muscle-')" refresh.html