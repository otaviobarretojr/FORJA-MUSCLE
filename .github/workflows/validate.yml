name: Validate FORJA MUSCLE

on:
  push:
    branches: [main, release-v3]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f assets/projecao-12-semanas.jpg
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f fragments/home-dashboard.html
          test -f fragments/nutrition.html
          test -f fragments/training.html
          test -f fragments/modals.html
          test -f css/v31.css
          test -f js/v31.js
          test -f css/v32.css
          test -f js/v32.js
          test -f css/v33.css
          test -f js/v33.js

      - name: Validate JavaScript syntax
        run: |
          for file in js/*.js service-worker.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Check shell references
        run: |
          grep -q "fragments/home-dashboard.html" service-worker.js
          grep -q "js/v30b2.js" service-worker.js
          grep -q "js/v31.js" service-worker.js
          grep -q "js/v32.js" service-worker.js
          grep -q "css/v32.css" service-worker.js
          grep -q "js/v33.js" service-worker.js
          grep -q "css/v33.css" service-worker.js
          grep -q "manifest.webmanifest" index.html
          grep -q "v32.js" index.html
          grep -q "v32.css" index.html
          grep -q "v33.js" index.html
          grep -q "v33.css" index.html

      - name: Validate v3.1 navigation bootstrap
        run: |
          grep -Fq "root.innerHTML=fragments.join('')" index.html
          ! grep -Fq "root.insertAdjacentHTML" index.html
          grep -Fq "const main=document.querySelector('main')" js/v31.js
          grep -Fq "createBottomNav(document.body)" js/v31.js
          grep -Fq "networkFirst" service-worker.js

      - name: Validate v3.2 training blocks and compatibility
        run: |
          grep -Fq "selectTrainingDay" js/v32.js
          grep -Fq "trainingDayStage" js/v32.js
          grep -Fq "Planejamento e ferramentas" js/v32.js
          grep -Fq "const NS='shape12.'" js/base.js

      - name: Validate v3.3 guided workout
        run: |
          grep -Fq "guided.exerciseIndex" js/v33.js
          grep -Fq "Concluir exercício" js/v33.js
          grep -Fq "TREINO DE HOJE" js/v33.js
          grep -Fq "visual técnico vetorial" js/v33.js
          grep -Fq "#treino #schedule{display:none!important}" css/v33.css
          grep -Fq "shape12.*" js/v33.js

      - name: Validate v3.3.1 fast startup
        run: |
          grep -Fq "const BUILD='3.3.1'" index.html
          grep -Fq "forja-muscle-v3-3-1" service-worker.js
          grep -Fq "preload.rel='preload'" index.html
          grep -Fq "preload.as='script'" index.html
          grep -Fq "Carregando seu treino" index.html
          grep -Fq "event.respondWith(cacheFirst(req)" service-worker.js
          ! grep -Fq "fetch('fragments/'+p+'?v='+BUILD,{cache:'no-store'})" index.html
          grep -Fq "const NS='shape12.'" js/base.js
