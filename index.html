<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="application-name" content="FORJA MUSCLE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORJA MUSCLE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>FORJA MUSCLE • Hipertrofia & Performance</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/v13.css">
<link rel="stylesheet" href="css/v14.css">
<link rel="stylesheet" href="css/v20.css">
<link rel="stylesheet" href="css/v21.css">
<link rel="stylesheet" href="css/v30.css">

</head>
<body>
<div id="forja-root"></div>
<script>
(async()=>{
 const root=document.getElementById('forja-root');
 const parts=['01-home.html','02-daily-dashboard.html','03-nav-nutrition.html','04-training.html','05-modals.html'];
 for(const p of parts){const r=await fetch('fragments/'+p);if(!r.ok)throw new Error('Falha ao carregar '+p);root.insertAdjacentHTML('beforeend',await r.text());}
 const scripts=['base.js','v13.js','v14.js','v20.js','v21.js','v30.js'];
 for(const s of scripts){await new Promise((ok,fail)=>{const el=document.createElement('script');el.src='js/'+s;el.onload=ok;el.onerror=fail;document.body.appendChild(el);});}
})().catch(err=>{document.getElementById('forja-root').innerHTML='<div style="padding:24px;font-family:sans-serif;color:white;background:#0c0f13;min-height:100vh"><h1>FORJA MUSCLE</h1><p>Não foi possível carregar o aplicativo.</p><pre>'+err.message+'</pre></div>';});
</script>
</body></html>
