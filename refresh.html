<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f13"><title>Atualizando FORJA MUSCLE</title></head><body style="margin:0;background:#0d0f13;color:#fff;font-family:system-ui,sans-serif"><main style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div><strong style="font-size:24px;letter-spacing:.08em">FORJA MUSCLE</strong><p style="opacity:.7">Atualizando o aplicativo…</p><small style="opacity:.5">Seus treinos e dados salvos serão preservados.</small></div></main><script>(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('forja-muscle-')).map(k=>caches.delete(k)))}}catch(e){}location.replace('./?fresh='+Date.now())})()</script></body></html>
