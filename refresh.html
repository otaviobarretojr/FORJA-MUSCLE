<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120d12"><title>Atualizando VITAFIT</title></head><body style="margin:0;background:radial-gradient(circle at 50% 35%,#21151e,#0b090d 62%);color:#fff9fc;font-family:system-ui,sans-serif"><main style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div><strong style="font-family:Georgia,serif;font-size:30px;font-weight:500;letter-spacing:.08em;color:#e8a2b1">VITAFIT</strong><p style="opacity:.72">Atualizando o aplicativo…</p><small style="opacity:.5">Treinos, cargas, alimentação e dados salvos serão preservados.</small></div></main><script>(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('forja-muscle-')).map(k=>caches.delete(k)))}}catch(e){}location.replace('./?fresh='+Date.now())})()</script></body></html>
